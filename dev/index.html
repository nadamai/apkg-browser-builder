<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>APKG Browser Builder ✨</title>
	<style>
		:root {
			--pico-font-size: 90%;
		}

		body, main {
			height: 100vh;
			display: flex;
			flex-direction: column;
		}

		#examples li {
			cursor: pointer;
		}

		#examples li.active {
			color: var(--pico-primary);
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main class="container">
		<header>
			<h1>APKG Browser Builder ✨</h1>
		</header>
		<hr />
		<main style="gap: 1rem">
			<div style="flex: 1; display: flex; gap: 2rem">
				<div style="flex: 1">
					<strong>Examples</strong>
					<ul id="examples"></ul>
				</div>
				<div style="flex: 5">
					<textarea id="code" style="height: 100%; pointer-events: auto;" disabled></textarea>
				</div>
			</div>
			<div style="text-align: right">
				<button onClick="downloadApkg()">Download APKG!</button>
			</div>
		</main>
		<hr />
		<footer style="text-align: center">
			Go to <a href="https://github.com/nadamai/apkg-browser-builder" target="_blank">GitHub</a> page
		</footer>
	</main>
    <script src="/index.dev.js"></script>
	<script>
		// ApkgBrowserBuilder is the dev-only global
		const { default: ApkgBuilder, Collection } = ApkgBrowserBuilder;

		const downloadApkg = () => {
			const collection = new Collection();
			const apkg = new ApkgBuilder(collection);

			apkg.init().then(() => {
				apkg.save('anki.apkg');
			});
		};

		fetch('/examples')
			.then((resource) => resource.json())
			.then((examples) => {
				const examplesList = document.getElementById('examples');
				const code = document.getElementById('code');

				examples.forEach(({ filename, content }) => {
					const element = document.createElement('li');

					element.textContent = filename.replace(/\.ts$/, '');

					element.onclick = () => {
						document.querySelectorAll("#examples > li").forEach((element) => element.className = "");

						element.className = "active";

						code.innerHTML = content;
					}

					examplesList.appendChild(element);
				});
			})
			.then(() => {
				document.querySelector("#examples > li:first-child").click();
			});
	</script>
</body>
</html>
