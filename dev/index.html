<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">
	<link rel="stylesheet" href="styles.css">
    <title>APKG Browser Builder ✨</title>
</head>
<body>
	<main class="container">
		<header>
			<h1>APKG Browser Builder ✨</h1>
		</header>
		<hr />
		<main>
			<div>
				<div>
					<strong>Examples</strong>
					<ul id="examples"></ul>
				</div>
				<div>
					<pre id="code"><code class="language-typescript"></code></pre>
				</div>
			</div>
			<div>
				<button onClick="downloadApkg()">Download APKG!</button>
			</div>
		</main>
		<hr />
		<footer>
			Go to <a href="https://github.com/nadamai/apkg-browser-builder" target="_blank">GitHub</a> page
		</footer>
	</main>
    <script src="/index.dev.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
	<script>
		// ApkgBrowserBuilder is the dev-only global
		const { default: ApkgBuilder, Collection } = ApkgBrowserBuilder;

		// TODO: downloading proper collection based on the selected example
		const downloadApkg = () => {
			const collection = new Collection();
			const apkg = new ApkgBuilder(collection);

			apkg.init().then(() => {
				apkg.save('anki.apkg');
			});
		};

		fetch('/examples')
			.then((resource) => resource.json())
			.then((examples) => {
				const examplesList = document.getElementById('examples');
				const code = document.querySelector('code');

				examples.forEach(({ filename, content }) => {
					const element = document.createElement('li');

					element.textContent = filename.replace(/\.ts$/, '');

					element.onclick = () => {
						document.querySelectorAll("#examples > li").forEach((element) => element.className = "");

						element.className = "active";
						code.textContent = content;

						Prism.highlightElement(code);
					}

					examplesList.appendChild(element);
				});
			})
			.then(() => {
				document.querySelector("#examples > li:first-child").click();
			});
	</script>
</body>
</html>
