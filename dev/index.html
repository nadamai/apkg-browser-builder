<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <title>APKG Browser Builder ✨</title>
	<style>
		:root {
			--pico-font-size: 90%;
		}

		#examples li {
			cursor: pointer;
		}

		#examples li.active {
			color: var(--pico-primary);
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main class="container">
		<header>
			<h1>APKG Browser Builder ✨</h1>
		</header>
		<hr />
		<main>
			<div style="display: flex; gap: 2rem">
				<div>
					<ul id="examples"></ul>
				</div>
				<div style="flex: 1">
					<textarea>Lorem ipsum dolor sit amet</textarea>
				</div>
			</div>
			<div style="text-align: right">
				<button onClick="downloadApkg()">Download APKG!</button>
			</div>
		</main>
		<hr />
		<footer style="text-align: center">
			Go to the <a href="https://github.com/nadamai/apkg-browser-builder" target="_blank">GitHub</a> page
		</footer>
	</main>
    <script src="/index.dev.js"></script>
	<script>
		// ApkgBrowserBuilder is the dev-only global
		const { default: ApkgBuilder, Collection } = ApkgBrowserBuilder;

		const downloadApkg = () => {
			const collection = new Collection();
			const apkg = new ApkgBuilder(collection);

			apkg.init().then(() => {
				apkg.save('anki.apkg');
			});
		};

		fetch('/examples')
			.then((resource) => resource.json())
			.then((examples) => {
				const examplesList = document.getElementById('examples');

				examples.forEach(({ filename, content }, i) => {
					const element = document.createElement('li');

					element.textContent = filename.replace(/\.ts/, '');

					if (i === 0) {
						element.className = "active";
					}

					examplesList.appendChild(element);
				});
			});
	</script>
</body>
</html>
